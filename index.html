<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ON/OFF</title>
<meta name="theme-color" content="#7B3FC4">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ON/OFF">
<style>
:root{--bg:#FBFAFD;--card:#fff;--ink:#1B1530;--mute:#8A84A0;--line:#EEEAF5;--pri:#7B3FC4;--pri2:#A56BE8;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15121F;--card:#1F1B2E;--ink:#F3F0FA;--mute:#9A94B2;--line:#2C2740}}
:root[data-theme="dark"]{--bg:#15121F;--card:#1F1B2E;--ink:#F3F0FA;--mute:#9A94B2;--line:#2C2740}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Plus Jakarta Sans",ui-rounded,"SF Pro Rounded",system-ui,sans-serif;min-height:100vh}
#app{max-width:480px;margin:0 auto;padding:20px 18px 110px}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
h1{font-size:34px;font-weight:800;letter-spacing:-1.2px;margin:6px 0 2px}
h2{font-size:22px;font-weight:700;letter-spacing:-.5px;margin:0 0 4px}
.sub{color:var(--mute);font-size:14px;margin:0 0 18px}
.h3{font-size:15px;font-weight:700;margin:26px 0 10px}
.banner{border-radius:26px;padding:18px;background:linear-gradient(135deg,var(--pri2),var(--pri));color:#fff;display:flex;align-items:center;gap:14px;margin-bottom:18px;min-height:112px}
.banner b{font-size:15px;font-weight:600;opacity:.9;display:block}
.banner .big{font-size:34px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-1px;line-height:1.15}
.banner .off{margin-left:auto;background:#fff;color:var(--pri);font-weight:800;padding:12px 18px;border-radius:16px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.tile{aspect-ratio:1;border-radius:26px;padding:12px;display:flex;flex-direction:column;justify-content:space-between;text-align:left;background:color-mix(in srgb,var(--c) 24%,var(--card));transition:transform .15s,background .2s;position:relative;overflow:hidden}
.tile:active{transform:scale(.95)}
.tile .ic{font-size:26px;line-height:1}
.tile .nm{font-size:12px;font-weight:800;letter-spacing:.2px}
.tile svg{position:absolute;right:8px;top:10px;width:34px;height:20px}
.tile .tm{font-size:12px;font-weight:700;font-variant-numeric:tabular-nums}
.tile.on{background:var(--c);color:#fff;animation:pulse 2s ease-in-out infinite}
.tile.add{background:transparent;border:2px dashed var(--line);align-items:center;justify-content:center;color:var(--mute);font-size:30px}
@keyframes pulse{50%{box-shadow:0 0 0 6px color-mix(in srgb,var(--c) 28%,transparent)}}
@media(prefers-reduced-motion:reduce){.tile.on{animation:none}*{transition:none!important}}
.card{background:var(--card);border-radius:22px;padding:16px;border:1px solid var(--line)}
.row{display:flex;align-items:center;gap:12px;padding:10px 0}
.row+.row{border-top:1px solid var(--line)}
.dot{width:34px;height:34px;border-radius:12px;display:grid;place-items:center;font-size:17px;flex:none}
.grow{flex:1;min-width:0}.grow b{display:block;font-size:14px}.grow span{font-size:12px;color:var(--mute)}
.dur{font-weight:700;font-size:14px;font-variant-numeric:tabular-nums}
.bar{height:8px;border-radius:8px;background:var(--line);margin-top:6px;overflow:hidden}.bar i{display:block;height:100%;border-radius:8px}
.total{font-size:44px;font-weight:800;letter-spacing:-2px;line-height:1}
.chart{display:flex;align-items:flex-end;gap:8px;height:150px;margin-top:6px}
.chart div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;font-size:10px;color:var(--mute);gap:4px}
.chart i{width:100%;border-radius:10px;background:color-mix(in srgb,var(--pri) 25%,var(--card));min-height:4px}
.chart .cur i{background:var(--pri)}
.heat{display:grid;grid-template-columns:28px repeat(7,1fr);gap:3px;font-size:10px;color:var(--mute);align-items:center}
.heat u{height:13px;border-radius:4px;background:var(--pri);text-decoration:none}
.nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:8px 14px calc(8px + env(safe-area-inset-bottom,0px));z-index:5}
.nav div{max-width:480px;margin:auto;display:flex;justify-content:space-around}
.nav button{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;font-weight:600;color:var(--mute);padding:4px 14px}
.nav button.a{color:var(--pri)}.nav svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.pill{background:var(--pri);color:#fff;padding:14px;border-radius:16px;font-weight:700;width:100%;margin-top:10px}
.ghost{background:color-mix(in srgb,var(--pri) 12%,var(--card));color:var(--pri);padding:14px;border-radius:16px;font-weight:700;width:100%;margin-top:10px}
.modal{position:fixed;inset:0;background:rgba(20,10,40,.45);display:flex;align-items:flex-end;justify-content:center;z-index:9}
.sheet{background:var(--card);width:100%;max-width:480px;border-radius:28px 28px 0 0;padding:22px 20px calc(22px + env(safe-area-inset-bottom,0px))}
input{width:100%;font:inherit;padding:14px;border-radius:14px;border:1px solid var(--line);background:var(--bg);color:var(--ink);margin:6px 0 12px}
.opts{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 12px}
.opts button{width:40px;height:40px;border-radius:13px;background:var(--bg);font-size:20px;border:2px solid transparent}
.opts button.s{border-color:var(--pri)}.opts.c button{border-radius:50%;width:32px;height:32px}
.wk{display:flex;justify-content:space-between;align-items:center}.wk button{font-size:20px;padding:6px 12px;color:var(--pri);font-weight:800}
.tl{position:relative;padding-left:4px}
label{font-size:12px;font-weight:700;color:var(--mute)}
</style></head>
<body><div id="app"></div>
<script>
const COL=["#F47FB0","#FFA63D","#3CC8B4","#7B93D6","#F2714E","#A56BE8","#F5C431","#58B8F0"];
const ICONS=["📚","💼","🎧","📖","🏃","🍴","🎨","🛌","✍️","🚌","💻","🩺","🎮","🧹","🎵","☕"];
const DEF=[["STUDY","📚",0],["WORK","💼",1],["LECTURE","🎧",2],["READING","📖",3],["WORKOUT","🏃",4],["MEAL","🍴",1],["ART","🎨",5],["REST","🛌",7]];
let S,tab="home",off=0,M=null;
try{S=JSON.parse(localStorage.getItem("onoff.v1"))}catch(e){}
if(!S)S={cats:DEF.map((d,i)=>({id:"c"+i,name:d[0],icon:d[1],color:COL[d[2]]})),logs:[],active:null};
const save=()=>{try{localStorage.setItem("onoff.v1",JSON.stringify(S))}catch(e){}};
const $=s=>document.querySelector(s);
const esc=t=>String(t).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const cat=id=>S.cats.find(c=>c.id===id)||{name:"DELETED",icon:"•",color:"#B0AAC0"};
const p2=n=>String(n).padStart(2,"0");
const hm=ms=>{const m=Math.round(ms/6e4);return m<60?m+"m":Math.floor(m/60)+"h "+p2(m%60)+"m"};
const hms=ms=>{const s=Math.floor(ms/1e3);return p2(Math.floor(s/3600))+":"+p2(Math.floor(s%3600/60))+":"+p2(s%60)};
const clk=t=>{const d=new Date(t);return p2(d.getHours())+":"+p2(d.getMinutes())};
const day0=t=>{const d=new Date(t);d.setHours(0,0,0,0);return d.getTime()};
function face(on){return on?'<svg viewBox="0 0 40 24"><circle cx="11" cy="9" r="4.5" fill="#1B1530"/><circle cx="29" cy="9" r="4.5" fill="#1B1530"/><circle cx="12.6" cy="7.4" r="1.4" fill="#fff"/><circle cx="30.6" cy="7.4" r="1.4" fill="#fff"/><path d="M15 17q5 4 10 0" stroke="#1B1530" stroke-width="2.2" fill="none" stroke-linecap="round"/></svg>':'<svg viewBox="0 0 40 24"><path d="M6 10q5 4 10 0M24 10q5 4 10 0" stroke="#1B1530" stroke-width="2.4" fill="none" stroke-linecap="round" opacity=".55"/><path d="M16 18q4 2.5 8 0" stroke="#1B1530" stroke-width="2" fill="none" stroke-linecap="round" opacity=".55"/></svg>'}
function stop(){if(!S.active)return;const e=Date.now();if(e-S.active.s>=1000)S.logs.push({cat:S.active.cat,s:S.active.s,e});S.active=null}
function tog(id){const was=S.active&&S.active.cat===id;stop();if(!was)S.active={cat:id,s:Date.now()};save();render()}
function seg(from,to){const all=S.logs.slice();if(S.active)all.push({cat:S.active.cat,s:S.active.s,e:Date.now()});const o=[];
for(const l of all){let a=Math.max(l.s,from),b=Math.min(l.e,to);while(a<b){const d=new Date(a);const n=Math.min(b,new Date(d.getFullYear(),d.getMonth(),d.getDate(),d.getHours()+1).getTime());o.push({cat:l.cat,d:(d.getDay()+6)%7,h:d.getHours(),ms:n-a});a=n}}return o}
function byCat(sg){const m={};sg.forEach(x=>m[x.cat]=(m[x.cat]||0)+x.ms);return Object.entries(m).sort((a,b)=>b[1]-a[1])}
function catRows(list){const max=list[0]?list[0][1]:1;return list.map(([id,ms])=>{const c=cat(id);return `<div class="row"><div class="dot" style="background:color-mix(in srgb,${c.color} 25%,var(--card))">${c.icon}</div><div class="grow"><b>${esc(c.name)}</b><div class="bar"><i style="width:${ms/max*100}%;background:${c.color}"></i></div></div><div class="dur">${hm(ms)}</div></div>`}).join("")}
const empty=t=>`<div class="card" style="text-align:center;color:var(--mute);font-size:14px;padding:26px">${t}</div>`;
const V={
home(){const a=S.active,c=a&&cat(a.cat);
return `<h1>ON/OFF</h1><p class="sub">One thing at a time.</p>`+
(a?`<div class="banner"><div style="width:54px">${face(1).replace("<svg",'<svg width="54" height="32" style="filter:invert(0)"')}</div><div><b>${c.icon} ${esc(c.name)} is ON</b><div class="big" data-t>${hms(Date.now()-a.s)}</div></div><button class="off" data-a="stop">OFF</button></div>`:
`<div class="banner"><div style="width:54px">${face(0).replace("<svg",'<svg width="54" height="32"').replace(/#1B1530/g,"#fff")}</div><div><b>Nothing is ON</b><div style="font-size:20px;font-weight:800">Tap to start</div></div></div>`)+
`<div class="grid">`+S.cats.map(c=>{const on=a&&a.cat===c.id;return `<button class="tile${on?" on":""}" style="--c:${c.color}" data-a="tog" data-id="${c.id}"><span class="ic">${c.icon}</span>${face(on)}<span><span class="nm">${esc(c.name)}</span>${on?`<div class="tm" data-t>${hms(Date.now()-a.s)}</div>`:""}</span></button>`}).join("")+`<button class="tile add" data-a="new" aria-label="Add category">+</button></div>`},
today(){const t0=day0(Date.now()),sg=seg(t0,t0+864e5),L=S.logs.filter(l=>l.e>t0).map(l=>({...l,s:Math.max(l.s,t0)}));
if(S.active)L.push({cat:S.active.cat,s:Math.max(S.active.s,t0),e:Date.now(),live:1});L.sort((a,b)=>a.s-b.s);
const tot=sg.reduce((n,x)=>n+x.ms,0);
return `<h2>Today</h2><p class="sub">${new Date().toLocaleDateString("en-US",{weekday:"long",month:"long",day:"numeric"})}</p>
<div class="card"><div class="total">${hm(tot)}</div><div class="sub" style="margin:4px 0 0">tracked today</div></div>
<div class="h3">Timeline</div>`+(L.length?`<div class="card">`+L.map(l=>{const c=cat(l.cat);return `<div class="row"><div class="dot" style="background:${c.color}">${c.icon}</div><div class="grow"><b>${esc(c.name)}${l.live?" · ON":""}</b><span>${clk(l.s)} → ${l.live?"now":clk(l.e)}</span></div><div class="dur">${hm(l.e-l.s)}</div></div>`}).join("")+`</div>`:empty("Nothing tracked yet. Tap a category on Home."))+
`<div class="h3">By category</div>`+(sg.length?`<div class="card">${catRows(byCat(sg))}</div>`:empty("Your summary shows up here."))},
week(){const d=new Date();d.setHours(0,0,0,0);d.setDate(d.getDate()-((d.getDay()+6)%7)+off*7);const w0=d.getTime(),w1=w0+7*864e5,sg=seg(w0,w1);
const days=[0,0,0,0,0,0,0],heat=Array.from({length:24},()=>[0,0,0,0,0,0,0]);sg.forEach(x=>{days[x.d]+=x.ms;heat[x.h][x.d]+=x.ms});
const tot=days.reduce((a,b)=>a+b,0),mx=Math.max(...days,1),td=(new Date().getDay()+6)%7,here=off===0;
const end=new Date(w1-1),lab=new Date(w0).toLocaleDateString("en-US",{month:"short",day:"numeric"})+" – "+end.toLocaleDateString("en-US",{month:"short",day:"numeric"});
return `<div class="wk"><button data-a="wk" data-n="-1" aria-label="Previous week">‹</button><div style="text-align:center"><h2 style="margin:0">${here?"This week":"Week"}</h2><div class="sub" style="margin:0">${lab}</div></div><button data-a="wk" data-n="1" aria-label="Next week" ${here?'disabled style="opacity:.25"':''}>›</button></div>
<div class="card" style="margin-top:14px"><div class="total">${hm(tot)}</div><div class="sub" style="margin:4px 0 0">total tracked time</div></div>
<div class="h3">Daily hours</div><div class="card"><div class="chart">${"MTWTFSS".split("").map((l,i)=>`<div class="${here&&i===td?"cur":""}"><span>${days[i]?hm(days[i]).replace(" ",""):""}</span><i style="height:${days[i]/mx*100*.78}%"></i>${l}</div>`).join("")}</div></div>
<div class="h3">Where my time went</div>`+(sg.length?`<div class="card">${catRows(byCat(sg))}</div>`:empty("No data for this week."))+
`<div class="h3">Weekly heatmap</div><div class="card"><div class="heat"><span></span>${"MTWTFSS".split("").map(l=>`<span style="text-align:center">${l}</span>`).join("")}${Array.from({length:18},(_,k)=>{const h=k+6;return `<span>${h%3===0?p2(h):""}</span>`+heat[h].map(ms=>`<u style="opacity:${ms?Math.min(1,.18+ms/36e5*.82):.07}"></u>`).join("")}).join("")}</div></div>`},
settings(){return `<h2>Settings</h2><p class="sub">Make the categories yours.</p><div class="card">`+S.cats.map(c=>`<div class="row"><div class="dot" style="background:${c.color}">${c.icon}</div><div class="grow"><b>${esc(c.name)}</b></div><button data-a="edit" data-id="${c.id}" class="dur" style="color:var(--pri)">Edit</button></div>`).join("")+`</div><button class="pill" data-a="new">Add category</button><div class="h3">Data</div><button class="ghost" data-a="sample">Load sample week</button><button class="ghost" data-a="reset" style="color:#E0475B">Erase all data</button><p class="sub" style="margin-top:18px;text-align:center">Data is stored only on this device.</p>`}};
const NAV=[["home","Home","M3 11l9-8 9 8v9a1 1 0 01-1 1h-5v-6H9v6H4a1 1 0 01-1-1z"],["today","Today","M8 6h12M8 12h12M8 18h12M3.5 6h.01M3.5 12h.01M3.5 18h.01"],["week","Week","M5 20V10M12 20V4M19 20v-7"],["settings","Settings","M12 15a3 3 0 100-6 3 3 0 000 6zM19 12a7 7 0 00-.1-1.2l2-1.5-2-3.4-2.3 1a7 7 0 00-2-1.2L14.3 3h-4l-.3 2.7a7 7 0 00-2 1.2l-2.3-1-2 3.4 2 1.5a7 7 0 000 2.4l-2 1.5 2 3.4 2.3-1a7 7 0 002 1.2l.3 2.7h4l.3-2.7a7 7 0 002-1.2l2.3 1 2-3.4-2-1.5c.1-.4.1-.8.1-1.2z"]];
function modal(){if(!M)return"";return `<div class="modal" data-a="close"><div class="sheet" onclick="event.stopPropagation()"><h2>${M.id?"Edit category":"New category"}</h2><label>Name</label><input id="nm" maxlength="14" placeholder="e.g. DRAWING" value="${esc(M.name)}" oninput="M.name=this.value"><label>Icon</label><div class="opts">${ICONS.map(i=>`<button class="${M.icon===i?"s":""}" data-a="ico" data-v="${i}">${i}</button>`).join("")}</div><label>Color</label><div class="opts c">${COL.map(c=>`<button class="${M.color===c?"s":""}" style="background:${c}" data-a="col" data-v="${c}" aria-label="Color"></button>`).join("")}</div><button class="pill" data-a="save">Save</button>${M.id?`<button class="ghost" data-a="del" style="color:#E0475B">Delete</button>`:""}</div></div>`}
function render(){$("#app").innerHTML=V[tab]()+`<nav class="nav"><div>${NAV.map(n=>`<button class="${tab===n[0]?"a":""}" data-a="tab" data-v="${n[0]}"><svg viewBox="0 0 24 24"><path d="${n[2]}"/></svg>${n[1]}</button>`).join("")}</div></nav>`+modal()}
document.addEventListener("click",e=>{const b=e.target.closest("[data-a]");if(!b)return;const a=b.dataset.a,v=b.dataset.v,id=b.dataset.id;
if(a==="tab"){tab=v;off=0;render();scrollTo(0,0)}
else if(a==="tog")tog(id);else if(a==="stop"){stop();save();render()}
else if(a==="wk"){off=Math.min(0,off+ +b.dataset.n);render()}
else if(a==="new"){M={id:null,name:"",icon:ICONS[0],color:COL[S.cats.length%COL.length]};render()}
else if(a==="edit"){const c=cat(id);M={...c};render()}
else if(a==="ico"){M.icon=v;render()}else if(a==="col"){M.color=v;render()}
else if(a==="close"){M=null;render()}
else if(a==="save"){const n=M.name.trim().toUpperCase();if(!n){$("#nm").focus();return}
if(M.id){Object.assign(S.cats.find(c=>c.id===M.id),{name:n,icon:M.icon,color:M.color})}else S.cats.push({id:"c"+Date.now(),name:n,icon:M.icon,color:M.color});M=null;save();render()}
else if(a==="del"){if(S.active&&S.active.cat===M.id)S.active=null;S.cats=S.cats.filter(c=>c.id!==M.id);M=null;save();render()}
else if(a==="sample"){sample();tab="week";render()}
else if(a==="reset"){if(confirm("Erase all tracked data and categories?")){localStorage.removeItem("onoff.v1");location.reload()}}});
function sample(){const now=Date.now();for(let d=6;d>=0;d--){let t=day0(now)-d*864e5+(8+Math.random()*2)*36e5;const n=4+Math.floor(Math.random()*3);
for(let i=0;i<n;i++){const dur=(30+Math.random()*90)*6e4,c=S.cats[Math.floor(Math.random()*S.cats.length)];if(t+dur>now)break;S.logs.push({cat:c.id,s:t,e:t+dur});t+=dur+(5+Math.random()*40)*6e4}}save()}
let k=0;setInterval(()=>{if(!S.active)return;document.querySelectorAll("[data-t]").forEach(el=>el.textContent=hms(Date.now()-S.active.s));if(tab!=="home"&&!M&&++k%30===0)render()},1000);
render();
/* PWA: inline manifest so the page is installable to the home screen */
try{const ic="data:image/svg+xml,"+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512"><rect width="512" height="512" fill="#7B3FC4"/><circle cx="180" cy="220" r="34" fill="#fff"/><circle cx="332" cy="220" r="34" fill="#fff"/><path d="M190 320q66 60 132 0" stroke="#fff" stroke-width="22" fill="none" stroke-linecap="round"/></svg>');
const m={name:"ON/OFF",short_name:"ON/OFF",display:"standalone",background_color:"#FBFAFD",theme_color:"#7B3FC4",start_url:".",icons:[{src:ic,sizes:"512x512",type:"image/svg+xml",purpose:"any"}]};
const l=document.createElement("link");l.rel="manifest";l.href=URL.createObjectURL(new Blob([JSON.stringify(m)],{type:"application/manifest+json"}));document.head.appendChild(l);
const a=document.createElement("link");a.rel="apple-touch-icon";a.href=ic;document.head.appendChild(a);
if("serviceWorker"in navigator&&location.protocol.startsWith("http"))navigator.serviceWorker.register("sw.js").catch(()=>{})}catch(e){}
</script></body></html>
